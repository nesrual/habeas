# habeas provider adapters: provider -> headless invocation template.
# Shell-sourceable; dispatch.sh substitutes {prompt_file} (the combined
# prompt+input file), {input_file} (raw input, rarely needed), and
# {model_args} / {effort_args} (e.g. "--model claude-opus-5-5" /
# "--effort high", from config models.<role> / effort.<role>; empty when
# unset) and runs the result through `bash -c` in the role's working directory.
#
# Contract every template must satisfy (plan 7.2): non-interactive, fresh
# session (no continue/resume), exits when done, repo READ allowed, writes and
# network OFF. All habeas roles are read-only: model roles only ever return
# JSON; every filesystem write in the pipeline is done by the scripts.
#
# Verified invocations (2026-09-05, macOS arm64):
#   claude 2.1.261 (Claude Code)  -- verified: JSON-only output, exit 0
#   codex-cli 0.153.4             -- verified: progress on stderr, answer on stdout
#   grok 1.0.13                   -- verified: JSON-only output, exit 0
#   pi 0.85.0                     -- invocation shape accepted; full run not
#                                    verified at build time (provider OAuth token
#                                    expired; run `pi` interactively to re-auth)

claude="claude -p --restricted --safe-mode --strict-mcp-config --no-session-persistence {model_args} {effort_args} --tools 'Read,Grep,Glob' < {prompt_file}"
codex="codex exec --ignore-user-config --ignore-rules --disable hooks --disable plugins --disable apps -c project_doc_max_bytes=0 {model_args} {codex_effort_args} {daybreak_args} --sandbox read-only --ephemeral --skip-git-repo-check - < {prompt_file}"
grok="grok --prompt-file {prompt_file} --tools read,grep,glob --disable-web-search"
pi="pi --print --no-extensions --no-skills --no-context-files --no-prompt-templates --no-session --tools read < {prompt_file}"

# user-supplied escape hatch, e.g. an ollama wrapper; may use {prompt_file}
generic="${HABEAS_GENERIC_CMD:-}"

# Optional per-provider read-only overrides for critic/proof_review roles
# (<provider>_ro). Unset here because the base templates are already
# read-only; kept as the mechanism for users whose base templates are looser.
