# habeas defaults. Copy to <target-repo>/config.yaml (or .audit/config.yaml)
# and adjust. Select the reviewed file with HABEAS_CONFIG=/absolute/path/to/config.yaml.
# Parsed by the restricted-YAML parser in scripts/state.py:
# two-space indent, scalars, lists, ONE nesting level of maps, null,
# no anchors, no multiline strings.
orchestration: inline            # inline | scripted (inline: the host model does scout/expert/prover
                                 #   work, so models.scout/expert/prover apply only when dispatched)
providers:
  scout: claude                  # key into adapters.conf
  expert: claude                 # also the prover's provider
  critic: claude                 # different MODEL from the expert (models.critic) keeps it independent
  proof_review: claude
models:                          # model per role, passed to the adapter as {model_args}; ids are
                                 #   provider-specific; null => the CLI's default. A pinned role never
                                 #   falls back to another provider. See references/models.md
  scout: claude-sonnet-5-5       # high volume, broad recall
  expert: claude-opus-5-5        # judgment: failure scenario + proof sketch (all expert-* routes)
  prover: claude-opus-5-5        # writes the RSpec/Jest proof + fix diff
  critic: claude-fable-5-2       # adversarial; must differ from models.expert
  proof_review: claude-sonnet-5-5  # checks the spec proves the claim
effort:                          # reasoning effort per role ({effort_args}); null => model default
  scout: medium
  expert: high
  prover: high
  critic: high
  proof_review: medium
proof:
  test_cmd: "bundle exec rspec {file}"
  framework: rspec               # rspec | pytest — governs log parsing and proof-spec naming
  spec_dir: "spec/audit"         # where proof specs are placed inside the worktree
  test_cmd_jest: null            # e.g. "npx jest --ci {file}"; findings with proof_sketch.type jest
                                 #   run with this + the jest parser; null => they quarantine
  jest_dir: "app/javascript/__audit__"  # where jest proofs land (must match jest testMatch/roots)
  boot_cmd: null                 # e.g. "bin/rails server -e test -p {port}"; null => HTTP claims quarantine
  base_url: null                 # e.g. "http://localhost:{port}"
  seed_cmd: null                 # synthetic fixtures only; never production copies
  timeout_s: 120
  attempts_max: 2
  repair_fixes: security_only    # always => proved bugs with unverified fix diffs get one prover repair pass
sandbox:
  mode: env                      # env requires HABEAS_ALLOW_HOST_PROOFS=1; container runs in Docker; none requires explicit acknowledgment
  env_allowlist: [PATH, HOME, LANG, GEM_HOME, GEM_PATH, BUNDLE_PATH]
  database_url: "postgres://localhost/habeas_throwaway"
  container_image: null          # required when mode: container
gates:
  advisory_severity_cap: medium
  max_candidates_per_unit: 8
  max_emissions_per_run: 5
packs:
  security_globs: ["app/controllers/application_controller.rb", "app/policies/**", "config/initializers/*auth*"]
tracker:
  kind: null                     # null disables; "jira" pushes emitted findings as tickets
  jira_base_url: null            # e.g. "https://yourorg.atlassian.net"
  jira_project: null             # e.g. AR
  jira_issue_type: Task          # JWM ("core") projects ship with Task
  jira_email: null               # or env JIRA_EMAIL; token ONLY via env JIRA_API_TOKEN
  tracks: [provable, advisory]   # which finding tracks become tickets
scope:
  exclude: ["vendor/", "node_modules/", "db/schema.rb", "tmp/", "log/", ".audit/", "issues/"]
scan:
  unit_max_lines: 500            # soft cap on lines of focus per run
  scout_sweeps: 1                # independent scout passes per run (union via dedupe); raise for recall
  parallel: 4                    # concurrent expert/critic dispatches (state writes stay serial)
  hotspot_exclude: ["spec/", "test/", "features/", "public/", "docs/", "doc/", "bin/", "node_modules/", "Gemfile.lock", "yarn.lock", "package-lock.json", "db/structure.sql"]
